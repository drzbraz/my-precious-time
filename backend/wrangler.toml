name = "precious-time-backend"
main = "src/index.js"
compatibility_date = "2026-09-09"

# Not secret — an OAuth client ID is meant to be public. Verifying a token's `aud` claim
# against this just confirms the token was issued to *this* extension, not a random client.
[vars]
OAUTH_CLIENT_ID = "329680931594-vsheq7o55regtk3r4475s2pvk1gl43eh.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "precious-time"
database_id = "601da03a-a506-44b4-8af9-3a44b98467f5"

[triggers]
crons = ["0 * * * *"]
